<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nginx Docker App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to Nginx 🚀</h1>

        <p>This application is running inside a Docker container.</p>

        <p>Deployed using Docker and CI/CD.</p>

        <div class="status">
            ✓ Nginx is Running
        </div>
    </div>

</body>
</html>
